<!DOCTYPE html>
<html>
<head>
<title>To Do List</title>
<style>
body{
    font-family: Arial;
    text-align: center;
    background: #f4f4f4;
}

.container{
    width: 300px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
}

input{
    width: 70%;
    padding: 8px;
}

button{
    padding: 8px 12px;
    cursor: pointer;
}

ul{
    list-style: none;
    padding: 0;
}

li{
    padding: 8px;
    background: #eee;
    margin-top: 5px;
    display: flex;
    justify-content: space-between;
}
</style>
</head>

<body>

<div class="container">
<h2>My To Do List</h2>

<input type="text" id="taskInput" placeholder="Enter task">
<button onclick="addTask()">Add</button>

<ul id="taskList"></ul>

</div>

<script>
function addTask(){
    let input = document.getElementById("taskInput");
    let task = input.value;

    if(task === ""){
        alert("Please enter a task");
        return;
    }

    let li = document.createElement("li");
    li.textContent = task;

    let deleteBtn = document.createElement("button");
    deleteBtn.textContent = "Delete";

    deleteBtn.onclick = function(){
        li.remove();
    }

    li.appendChild(deleteBtn);
    document.getElementById("taskList").appendChild(li);

    input.value = "";
}
</script>

</body>
</html>
